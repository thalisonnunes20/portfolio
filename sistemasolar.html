<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sistema Solar 3D | Menu Moderno + Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'DM Sans', system-ui, sans-serif;
            color: white;
            background: #000;
        }

        /* Fundo espacial */
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #050514 0%, #000000 100%);
            z-index: -2;
        }

        .noise {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.08;
            background: repeating-radial-gradient(circle at 20% 30%, rgba(255,255,255,0.03) 0px, rgba(0,0,0,0.1) 2px, transparent 3px);
            mix-blend-mode: overlay;
        }

        /* ===== BOTÃO HAMBURGUER ===== */
        .hamburger {
            position: absolute;
            top: 22px;
            left: 22px;
            z-index: 100;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, transform 0.12s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.07);
        }

        .hamburger:hover {
            background: rgba(240,155,70,0.13);
            border-color: rgba(240,155,70,0.38);
            box-shadow: 0 4px 24px rgba(220,110,30,0.28), inset 0 1px 0 rgba(255,255,255,0.07);
        }

        .hamburger:active { transform: scale(0.92); }

        .hamburger-icon {
            width: 17px;
            height: 13px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger-icon span {
            display: block;
            height: 1.5px;
            background: rgba(235,215,185,0.88);
            border-radius: 2px;
            transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
        }

        .hamburger-icon span:nth-child(2) { width: 68%; }

        .hamburger.open .hamburger-icon span:nth-child(1) {
            transform: rotate(45deg) translate(4px, 4px);
            width: 100%;
        }
        .hamburger.open .hamburger-icon span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger.open .hamburger-icon span:nth-child(3) {
            transform: rotate(-45deg) translate(4px, -4px);
        }

        /* ===== PAINEL DE MENU ===== */
        .menu-panel {
            position: absolute;
            top: 78px;
            left: 22px;
            z-index: 99;
            width: 225px;
            background: rgba(7,7,20,0.9);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transform: translateY(-10px) scale(0.96);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.34,1.12,0.64,1), opacity 0.22s ease;
            pointer-events: none;
            box-shadow: 0 28px 56px rgba(0,0,0,0.65), 0 0 0 0.5px rgba(255,255,255,0.04), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .menu-panel.open {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .menu-header {
            padding: 13px 16px 11px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-header-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle, #f0a060, #e06020);
            box-shadow: 0 0 6px rgba(240,120,40,0.7);
            flex-shrink: 0;
        }

        .menu-title {
            font-family: 'Syne', sans-serif;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.19em;
            color: rgba(195,178,150,0.58);
            text-transform: uppercase;
        }

        .menu-planets-grid {
            padding: 7px 8px 9px;
            max-height: 62vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .menu-planets-grid::-webkit-scrollbar { width: 2px; }
        .menu-planets-grid::-webkit-scrollbar-track { background: transparent; }
        .menu-planets-grid::-webkit-scrollbar-thumb { background: rgba(240,150,70,0.28); border-radius: 2px; }

        .planet-menu-btn {
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 8px 10px 8px 12px;
            font-size: 13.5px;
            font-weight: 400;
            color: rgba(215,210,230,0.78);
            cursor: pointer;
            transition: background 0.14s ease, color 0.14s ease, transform 0.14s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'DM Sans', sans-serif;
            width: 100%;
            text-align: left;
            position: relative;
            letter-spacing: 0.01em;
        }

        .planet-menu-btn .planet-emoji {
            font-size: 1.05rem;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
            filter: drop-shadow(0 0 3px rgba(255,180,80,0.3));
        }

        .planet-menu-btn:hover {
            background: rgba(255,255,255,0.065);
            color: rgba(240,230,210,1);
            transform: translateX(2px);
        }

        .planet-menu-btn:active { transform: scale(0.97) translateX(1px); }

        .planet-menu-btn.active {
            background: rgba(240,148,60,0.11);
            color: #f2c08a;
            font-weight: 500;
        }

        .planet-menu-btn.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 2.5px;
            height: 55%;
            background: linear-gradient(to bottom, #f0a060, #e07030);
            border-radius: 0 2px 2px 0;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255,255,255,0.07);
            margin: 4px 6px;
        }

        .reset-menu-btn {
            color: rgba(170,165,190,0.65);
        }

        .reset-menu-btn:hover {
            background: rgba(255,255,255,0.055);
            color: rgba(200,195,220,0.9);
        }

        /* ===== CARD DE INFORMAÇÕES ===== */
        .info-card {
            position: absolute;
            bottom: 22px;
            left: 22px;
            background: rgba(7,7,20,0.86);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 16px;
            padding: 13px 17px 14px;
            max-width: 275px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 18px 44px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
            pointer-events: none;
            z-index: 20;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.28s cubic-bezier(0.34,1.12,0.64,1);
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 5%, rgba(240,148,60,0.55) 45%, rgba(240,180,100,0.55) 60%, transparent 95%);
        }

        .info-card h3 {
            margin: 0 0 6px;
            font-size: 1.03rem;
            font-weight: 600;
            font-family: 'Syne', sans-serif;
            color: #f0c88a;
            letter-spacing: 0.015em;
        }

        .info-card p {
            margin: 3px 0;
            font-size: 0.78rem;
            line-height: 1.55;
            color: rgba(195,188,215,0.82);
            font-weight: 300;
        }

        .info-card .stat {
            display: block;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: 9px;
            padding-top: 8px;
            font-size: 0.68rem;
            color: rgba(165,158,188,0.58);
            letter-spacing: 0.025em;
        }

        /* Ajustes mobile */
        @media (max-width: 700px) {
            .hamburger { top: 16px; left: 16px; width: 40px; height: 40px; border-radius: 11px; }
            .hamburger-icon { width: 15px; height: 11px; }
            .menu-panel { top: 68px; left: 14px; width: 208px; }
            .menu-header { padding: 11px 14px 9px; }
            .planet-menu-btn { padding: 7px 9px 7px 10px; font-size: 13px; }
            .info-card { bottom: 14px; left: 14px; max-width: 235px; padding: 11px 15px 12px; }
            .info-card h3 { font-size: 0.97rem; }
        }

        @media (max-width: 480px) {
            .info-card { max-width: 200px; }
            .info-card p { font-size: 0.74rem; }
            .planet-menu-btn { font-size: 12.5px; }
        }

        @media (hover: none) and (pointer: coarse) {
            .planet-menu-btn:active {
                background: rgba(240,148,60,0.14);
                color: #f2c08a;
                transform: scale(0.97);
            }
        }
    </style>
</head>
<body>
    <div class="cosmic-bg"></div>
    <div class="noise"></div>

    <!-- Botão Hamburguer -->
    <div class="hamburger" id="hamburgerBtn">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Painel de menu deslizante -->
    <div class="menu-panel" id="menuPanel">
        <div class="menu-header">
            <div class="menu-header-dot"></div>
            <span class="menu-title">Sistema Solar</span>
        </div>
        <div class="menu-planets-grid" id="menuGrid"></div>
    </div>

    <!-- Card de informações (sem badge inferior direito) -->
    <div class="info-card" id="info-card">
        <h3>🌌 Sistema Solar</h3>
        <p>Clique em qualquer planeta para explorar. Câmera segue sem obstrução do Sol.</p>
        <div class="stat">💫 Arraste para orbitar | Zoom nos detalhes</div>
    </div>

    <!-- Importações Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- OTIMIZAÇÃO MOBILE: reduzir qualidade de efeitos e partículas em telas pequenas ---
        const isMobile = window.innerWidth <= 768;
        const starCount = isMobile ? 1800 : 4000;
        const asteroidCountMobile = isMobile ? 900 : 2000;
        const bloomStrength = isMobile ? 0.4 : 0.55;
        
        // --- CENA, CÂMERA, RENDERIZADOR ---
        const scene = new THREE.Scene();
        scene.background = null;
        scene.fog = new THREE.FogExp2(0x000000, 0.0006);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.5, 17);
        
        const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.15;
        document.body.appendChild(renderer.domElement);
        
        // Efeito Bloom (adaptado para mobile)
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), bloomStrength, 0.3, 0.6);
        bloomPass.threshold = 0.1;
        bloomPass.strength = bloomStrength;
        bloomPass.radius = 0.4;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // Controles Orbit
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.9;
        controls.rotateSpeed = 0.7;
        controls.target.set(0, 0, 0);
        
        // --- LUZES ---
        const ambientLight = new THREE.AmbientLight(0x222222, 0.45);
        scene.add(ambientLight);
        
        const sunLight = new THREE.PointLight(0xffaa66, 1.6, 45);
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = !isMobile;
        scene.add(sunLight);
        
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        fillLight.position.set(5, 10, 7);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0x4466cc, 0.3);
        backLight.position.set(-3, 2, -5);
        scene.add(backLight);
        
        // --- ESTRELAS DE FUNDO (otimizado)---
        function createStarField(count, radius, size, color) {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for (let i = 0; i < count; i++) {
                const r = radius * Math.cbrt(Math.random());
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);
                pos.push(x, y, z);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
            const mat = new THREE.PointsMaterial({ color: color, size: size, transparent: true, blending: THREE.AdditiveBlending });
            return new THREE.Points(geo, mat);
        }
        
        const stars1 = createStarField(starCount, 280, isMobile ? 0.07 : 0.09, 0xffffff);
        const stars2 = createStarField(Math.floor(starCount * 0.7), 420, 0.05, 0xaaccff);
        scene.add(stars1);
        scene.add(stars2);
        
        // --- TEXTURAS PROCEDURAIS (mantidas)---
        function createPlanetTexture(baseColor, spotColor, hasSpots = true, spotCount = 200) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (hasSpots) {
                for (let i = 0; i < spotCount; i++) {
                    ctx.fillStyle = spotColor;
                    ctx.beginPath();
                    ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 12 + 3, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(255,255,200,0.1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.2)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            return new THREE.CanvasTexture(canvas);
        }
        
        function createJupiterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d8a27a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 25; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * 45);
                ctx.bezierCurveTo(canvas.width/3, i * 45 + 35, canvas.width*2/3, i * 45 - 25, canvas.width, i * 45 + 15);
                ctx.lineWidth = 28;
                ctx.strokeStyle = `rgba(150, 90, 50, 0.7)`;
                ctx.stroke();
            }
            ctx.fillStyle = '#aa5544';
            ctx.beginPath();
            ctx.ellipse(canvas.width*0.68, canvas.height*0.52, 90, 60, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#884433';
            ctx.beginPath();
            ctx.ellipse(canvas.width*0.65, canvas.height*0.5, 55, 40, 0, 0, Math.PI*2);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }
        
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4c8cbf';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#6aab6a';
            ctx.beginPath();
            ctx.ellipse(280, 410, 130, 110, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(710, 520, 150, 120, -0.2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#c9b36b';
            ctx.beginPath();
            ctx.ellipse(820, 260, 100, 80, 0.4, 0, Math.PI*2);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }
        
        function createMarsTexture() { return createPlanetTexture('#c46b3e', '#8b3e1c', true, 400); }
        function createMercuryTexture() { return createPlanetTexture('#bc9a6c', '#7a5a3a', true, 500); }
        function createVenusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e6b800';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 180; i++) {
                ctx.fillStyle = `rgba(200, 140, 50, ${Math.random() * 0.5})`;
                ctx.beginPath();
                ctx.ellipse(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 40 + 10, Math.random() * 30 + 8, 0, 0, Math.PI*2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }
        function createSaturnTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e8cfb0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 12; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * 85);
                ctx.lineTo(canvas.width, i * 85 + 40);
                ctx.lineWidth = 30;
                ctx.strokeStyle = `rgba(170, 130, 80, 0.6)`;
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }
        function createIceGiantTexture(color) { return createPlanetTexture(color, '#b0e0ff', true, 150); }
        
        // --- SOL ---
        const sunGeo = new THREE.SphereGeometry(1.8, 128, 128);
        const sunMat = new THREE.MeshStandardMaterial({ color: 0xffaa55, emissive: 0xff4411, emissiveIntensity: 1.05, metalness: 0.1, roughness: 0.3 });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sunMesh);
        
        const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(1.98, 64, 64), new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.2, side: THREE.BackSide }));
        scene.add(sunGlow);
        
        // --- DADOS DOS PLANETAS ---
        const planetsData = [
            { name: 'Mercúrio', key: 'mercury', color: 0xbc9a6c, size: 0.28, distance: 2.8, speed: 0.024, texture: createMercuryTexture(), rotationSpeed: 0.012, emoji: '🪨' },
            { name: 'Vênus',   key: 'venus',   color: 0xe6b800, size: 0.35, distance: 3.6, speed: 0.014, texture: createVenusTexture(), rotationSpeed: 0.008, emoji: '🔥' },
            { name: 'Terra',   key: 'earth',   color: 0x4c8cbf, size: 0.38, distance: 4.5, speed: 0.0115, texture: createEarthTexture(), rotationSpeed: 0.01, emoji: '🌍' },
            { name: 'Marte',   key: 'mars',    color: 0xc46b3e, size: 0.34, distance: 5.4, speed: 0.0095, texture: createMarsTexture(), rotationSpeed: 0.009, emoji: '🔴' },
            { name: 'Júpiter', key: 'jupiter', color: 0xd8a27a, size: 0.85, distance: 7.2, speed: 0.0058, texture: createJupiterTexture(), rotationSpeed: 0.02, emoji: '🪐' },
            { name: 'Saturno', key: 'saturn',  color: 0xe8cfb0, size: 0.75, distance: 8.8, speed: 0.0042, texture: createSaturnTexture(), rotationSpeed: 0.018, hasRing: true, emoji: '💍' },
            { name: 'Urano',   key: 'uranus',  color: 0xb0e0e6, size: 0.62, distance: 10.5, speed: 0.0033, texture: createIceGiantTexture('#b0e0e6'), rotationSpeed: 0.015, emoji: '❄️' },
            { name: 'Netuno',  key: 'neptune', color: 0x4169e1, size: 0.60, distance: 12.0, speed: 0.0027, texture: createIceGiantTexture('#4169e1'), rotationSpeed: 0.014, emoji: '🌊' }
        ];
        
        const planets = [];
        const planetMap = new Map();
        
        // Criar órbitas
        planetsData.forEach(data => {
            const points = [];
            const seg = 128;
            for (let i = 0; i <= seg; i++) {
                const angle = (i / seg) * Math.PI * 2;
                const x = data.distance * Math.cos(angle);
                const z = data.distance * Math.sin(angle);
                points.push(new THREE.Vector3(x, 0, z));
            }
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
            const orbitMat = new THREE.LineBasicMaterial({ color: 0x77aaff, transparent: true, opacity: 0.3 });
            const orbit = new THREE.LineLoop(orbitGeo, orbitMat);
            scene.add(orbit);
        });
        
        // Criar planetas
        planetsData.forEach(data => {
            const geo = new THREE.SphereGeometry(data.size, 96, 96);
            const mat = new THREE.MeshStandardMaterial({ map: data.texture, roughness: 0.5, metalness: 0.2 });
            const planet = new THREE.Mesh(geo, mat);
            planet.userData = {
                distance: data.distance,
                speed: data.speed,
                angle: Math.random() * Math.PI * 2,
                name: data.name,
                key: data.key,
                rotationSpeed: data.rotationSpeed,
                hasRing: data.hasRing
            };
            const angle = planet.userData.angle;
            planet.position.set(data.distance * Math.cos(angle), 0, data.distance * Math.sin(angle));
            scene.add(planet);
            
            if (data.hasRing) {
                const ringGeo = new THREE.TorusGeometry(data.size * 1.28, 0.09, 64, 200);
                const ringMat = new THREE.MeshStandardMaterial({ color: 0xcbb88e, metalness: 0.4, roughness: 0.5, transparent: true });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.2;
                planet.add(ring);
                const ring2Geo = new THREE.TorusGeometry(data.size * 1.45, 0.05, 64, 200);
                const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xaa9977 });
                const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
                ring2.rotation.x = Math.PI / 2.3;
                planet.add(ring2);
            }
            
            planets.push(planet);
            planetMap.set(data.key, planet);
        });
        
        // Cinturão de asteroides reduzido em mobile
        const asteroidCountFinal = isMobile ? 900 : 2000;
        const asteroidGeo = new THREE.BufferGeometry();
        const astPos = [];
        for (let i = 0; i < asteroidCountFinal; i++) {
            const r = 6.3 + Math.random() * 1.3;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 0.7;
            astPos.push(Math.cos(angle) * r, y, Math.sin(angle) * r);
        }
        asteroidGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(astPos), 3));
        const asteroidField = new THREE.Points(asteroidGeo, new THREE.PointsMaterial({ color: 0xaa8866, size: 0.045 }));
        scene.add(asteroidField);
        
        // Coroa solar reduzida em mobile
        const coronaCount = isMobile ? 400 : 1000;
        const coronaParticles = new THREE.Points(
            new THREE.BufferGeometry().setFromPoints(Array.from({ length: coronaCount }, () => {
                const r = 2.0 + Math.random() * 0.8;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                return new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta) * 0.6, r * Math.cos(phi));
            })),
            new THREE.PointsMaterial({ color: 0xffaa66, size: 0.04, blending: THREE.AdditiveBlending })
        );
        scene.add(coronaParticles);

        // =============================================
        // --- COMETA HALLEY ---
        // =============================================
        // Parâmetros orbitais (órbita elíptica altamente excêntrica)
        const halleyA = 15.8;                        // semi-eixo maior (escala da cena)
        const halleyE = 0.967;                       // excentricidade real do Halley
        const halleyC = halleyA * halleyE;           // distância focal
        const halleyB = halleyA * Math.sqrt(1 - halleyE * halleyE); // semi-eixo menor ≈ 4.0
        // Inclinação real ~162° (órbita retrógrada), simplificada em 3 eixos para visibilidade
        const halleyTilt = new THREE.Euler(0.30, 0.45, 0.22);

        // --- Órbita elíptica (sol num foco) ---
        const halleyOrbitPts = [];
        for (let i = 0; i <= 300; i++) {
            const t = (i / 300) * Math.PI * 2;
            const px = halleyA * Math.cos(t) - halleyC;
            const pz = halleyB * Math.sin(t);
            const pt = new THREE.Vector3(px, 0, pz);
            pt.applyEuler(halleyTilt);
            halleyOrbitPts.push(pt);
        }
        const halleyOrbitLine = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(halleyOrbitPts),
            new THREE.LineBasicMaterial({ color: 0x66bbff, transparent: true, opacity: 0.38 })
        );
        scene.add(halleyOrbitLine);

        // --- Núcleo do cometa ---
        const halleyMat = new THREE.MeshStandardMaterial({
            color: 0x99aabb,
            emissive: 0x3399cc,
            emissiveIntensity: 0.8,
            roughness: 0.9,
            metalness: 0.05
        });
        const halleyMesh = new THREE.Mesh(new THREE.SphereGeometry(0.19, 20, 20), halleyMat);
        halleyMesh.userData = { name: 'Cometa Halley', key: 'halley' };
        scene.add(halleyMesh);

        // Coma (nebulosa gasosa ao redor do núcleo)
        const comaMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.42, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x99ddff, transparent: true, opacity: 0.10, side: THREE.BackSide })
        );
        halleyMesh.add(comaMesh);

        // --- Cauda de partículas (poeira + plasma) ---
        const tailCount = isMobile ? 180 : 400;
        const tailGeo = new THREE.BufferGeometry();
        const tailPos = new Float32Array(tailCount * 3);
        tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));

        // Offsets perpendiculares fixos por partícula (evita flickering)
        const tailOffsets = new Float32Array(tailCount * 2);
        for (let i = 0; i < tailCount; i++) {
            tailOffsets[i * 2]     = (Math.random() - 0.5) * 0.22;
            tailOffsets[i * 2 + 1] = (Math.random() - 0.5) * 0.22;
        }

        const tailMat = new THREE.PointsMaterial({
            color: 0xaae8ff,
            size: isMobile ? 0.055 : 0.068,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const tailParticles = new THREE.Points(tailGeo, tailMat);
        scene.add(tailParticles);

        // Estado de ângulo orbital do Halley (começa perto do periélio)
        let halleyAngle = -0.25;
        const halleyBaseSpeed = 0.00055;

        planetMap.set('halley', halleyMesh);

        // --- MODO SEGUIR PLANETA (câmera inteligente)---
        let followingPlanet = null;
        let followModeActive = false;
        
        function getCameraPositionForPlanet(planetPos) {
            const sunPos = new THREE.Vector3(0,0,0);
            const toPlanet = new THREE.Vector3().subVectors(planetPos, sunPos).normalize();
            const up = new THREE.Vector3(0, 1, 0);
            let right = new THREE.Vector3().crossVectors(toPlanet, up).normalize();
            if (Math.abs(right.length()) < 0.1) right = new THREE.Vector3(1, 0, 0);
            const offsetDir = right.clone().multiplyScalar(1.2).add(up.clone().multiplyScalar(0.6)).normalize();
            const distance = Math.max(2.5, Math.min(5.2, planetPos.length() * 0.32 + 1.2));
            return planetPos.clone().add(offsetDir.multiplyScalar(distance));
        }
        
        function setFollowPlanet(planet) {
            followingPlanet = planet;
            followModeActive = true;
            const planetPos = planet.position.clone();
            const newCamPos = getCameraPositionForPlanet(planetPos);
            camera.position.copy(newCamPos);
            controls.target.copy(planetPos);
            controls.update();
            updateInfoAndActive(planet.userData.name, planet.userData.key);
        }
        
        function updateFollowing() {
            if (followModeActive && followingPlanet) {
                controls.target.copy(followingPlanet.position);
            }
        }
        
        function resetToOverview() {
            followingPlanet = null;
            followModeActive = false;
            camera.position.set(0, 4.5, 17);
            controls.target.set(0, 0, 0);
            controls.update();
            if (currentHighlight) {
                currentHighlight.material.emissiveIntensity = currentHighlight.userData.oldEmissive || 0;
                if (currentHighlight.userData.outlineEffect) currentHighlight.remove(currentHighlight.userData.outlineEffect);
                currentHighlight = null;
            }
            document.getElementById('info-card').innerHTML = `<h3>🌌 Sistema Solar</h3><p>Clique em qualquer planeta para explorar. Câmera segue sem obstrução do Sol.</p><div class="stat">💫 Arraste para orbitar | Zoom nos detalhes</div>`;
            updateActiveMenuButton(null);
        }
        
        function updateInfoAndActive(planetName, planetKey) {
            const data = planetsData.find(p => p.key === planetKey);
            if (data) {
                let ringText = data.hasRing ? ' | Anéis destacados' : '';
                document.getElementById('info-card').innerHTML = `<h3>🪐 ${data.name}</h3><p>Diâmetro: ${(data.size * 8000).toFixed(0)} km (escala)<br>Distância: ${data.distance} UA | Velocidade orbital: ${(data.speed * 30).toFixed(2)} km/s${ringText}</p><div class="stat">✨ Rotação própria | 🌠 Arraste para orbitar</div>`;
            }
            updateActiveMenuButton(planetKey);
        }
        
        let currentHighlight = null;
        function highlightPlanet(planetMesh) {
            if (currentHighlight === planetMesh) return;
            if (currentHighlight) {
                currentHighlight.material.emissiveIntensity = currentHighlight.userData.oldEmissive || 0;
                if (currentHighlight.userData.outlineEffect) currentHighlight.remove(currentHighlight.userData.outlineEffect);
            }
            const outlineMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.35, side: THREE.BackSide });
            const outlineGeo = new THREE.SphereGeometry(planetMesh.geometry.parameters.radius * 1.08, 32, 32);
            const outline = new THREE.Mesh(outlineGeo, outlineMat);
            planetMesh.add(outline);
            planetMesh.userData.outlineEffect = outline;
            planetMesh.userData.oldEmissive = planetMesh.material.emissiveIntensity || 0;
            planetMesh.material.emissiveIntensity = 0.4;
            currentHighlight = planetMesh;
        }
        
        // --- MENU HAMBURGUER DINÂMICO ---
        const menuGrid = document.getElementById('menuGrid');
        const hamburger = document.getElementById('hamburgerBtn');
        const panel = document.getElementById('menuPanel');
        
        function updateActiveMenuButton(activeKey) {
            document.querySelectorAll('.planet-menu-btn').forEach(btn => {
                if ((activeKey && btn.dataset.planetKey === activeKey) || (activeKey === 'sun' && btn.dataset.planetKey === 'sun')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        function buildMenu() {
            menuGrid.innerHTML = '';
            // Botão Sol
            const sunBtn = document.createElement('button');
            sunBtn.className = 'planet-menu-btn';
            sunBtn.dataset.planetKey = 'sun';
            sunBtn.innerHTML = `<span class="planet-emoji">☀️</span> Sol`;
            sunBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                selectPlanet('sun');
                panel.classList.remove('open');
                hamburger.classList.remove('open');
            });
            menuGrid.appendChild(sunBtn);
            
            // Planetas
            planetsData.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'planet-menu-btn';
                btn.dataset.planetKey = p.key;
                btn.innerHTML = `<span class="planet-emoji">${p.emoji}</span> ${p.name}`;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectPlanet(p.key);
                    panel.classList.remove('open');
                    hamburger.classList.remove('open');
                });
                menuGrid.appendChild(btn);
            });

            // Cometa Halley
            const halleyBtn = document.createElement('button');
            halleyBtn.className = 'planet-menu-btn';
            halleyBtn.dataset.planetKey = 'halley';
            halleyBtn.innerHTML = `<span class="planet-emoji">☄️</span> Cometa Halley`;
            halleyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                selectPlanet('halley');
                panel.classList.remove('open');
                hamburger.classList.remove('open');
            });
            menuGrid.appendChild(halleyBtn);
            
            // Divisor
            const divider = document.createElement('div');
            divider.className = 'menu-divider';
            menuGrid.appendChild(divider);

            // Botão Visão Geral (reset)
            const resetBtn = document.createElement('button');
            resetBtn.className = 'planet-menu-btn reset-menu-btn';
            resetBtn.innerHTML = `<span class="planet-emoji">🌠</span> Visão Geral`;
            resetBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                resetToOverview();
                panel.classList.remove('open');
                hamburger.classList.remove('open');
            });
            menuGrid.appendChild(resetBtn);
        }
        
        function selectPlanet(key) {
            if (key === 'sun') {
                resetToOverview();
                highlightPlanet(sunMesh);
                document.getElementById('info-card').innerHTML = `<h3>☀️ Sol</h3><p>Estrela central. Temperatura ~5500°C. 99,86% da massa do sistema.</p><div class="stat">🔆 Diâmetro: 1,39M km | Classe: Anã amarela</div>`;
                updateActiveMenuButton('sun');
                return;
            }
            if (key === 'halley') {
                setFollowPlanet(halleyMesh);
                highlightPlanet(halleyMesh);
                document.getElementById('info-card').innerHTML = `<h3>☄️ Cometa Halley</h3><p>Período orbital: ~75-76 anos. Última passagem: 1986.<br>Próxima visita ao Sol: <strong style="color:#aae8ff">2061</strong>.<br>Excentricidade: 0.967 | Inclinação: 162° (retrógrado)</p><div class="stat">🌟 Cauda de plasma e poeira | Núcleo ~15 km</div>`;
                updateActiveMenuButton('halley');
                return;
            }
            const planet = planetMap.get(key);
            if (planet) {
                setFollowPlanet(planet);
                highlightPlanet(planet);
                updateActiveMenuButton(key);
            }
        }
        
        buildMenu();
        
        // Eventos Hamburguer e fechar ao clicar fora
        hamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            panel.classList.toggle('open');
            hamburger.classList.toggle('open');
        });
        
        document.addEventListener('click', (e) => {
            if (!panel.contains(e.target) && !hamburger.contains(e.target) && panel.classList.contains('open')) {
                panel.classList.remove('open');
                hamburger.classList.remove('open');
            }
        });
        
        // Raycaster para clique nos planetas (3D)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const allClickable = [...planets, halleyMesh];
            const planetIntersects = raycaster.intersectObjects(allClickable);
            if (planetIntersects.length > 0) {
                const clicked = planetIntersects[0].object;
                selectPlanet(clicked.userData.key);
                return;
            }
            const sunIntersect = raycaster.intersectObject(sunMesh);
            if (sunIntersect.length > 0) selectPlanet('sun');
        });
        
        // --- ANIMAÇÃO ---
        let lastTime = performance.now();
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            
            planets.forEach(planet => {
                const data = planet.userData;
                data.angle += data.speed * 0.55 * (delta * 30);
                if (data.angle > Math.PI * 2) data.angle -= Math.PI * 2;
                const x = data.distance * Math.cos(data.angle);
                const z = data.distance * Math.sin(data.angle);
                planet.position.set(x, 0, z);
                planet.rotation.y += data.rotationSpeed * (delta * 30);
            });
            
            sunMesh.rotation.y += 0.008;
            sunGlow.rotation.y += 0.003;
            coronaParticles.rotation.y += 0.002;
            sunLight.intensity = 1.5 + Math.sin(Date.now() * 0.003) * 0.2;
            sunMat.emissiveIntensity = 1.0 + Math.sin(Date.now() * 0.0028) * 0.2;
            stars1.rotation.y += 0.0003;
            stars2.rotation.x += 0.0002;
            asteroidField.rotation.y += 0.0008;

            // --- Animação do Cometa Halley (órbita elíptica + cauda dinâmica) ---
            // Velocidade varia com distância ao Sol (2ª Lei de Kepler)
            const halleyPx = halleyA * Math.cos(halleyAngle) - halleyC;
            const halleyPz = halleyB * Math.sin(halleyAngle);
            const halleyDistNow = Math.sqrt(halleyPx * halleyPx + halleyPz * halleyPz);
            const keplerSpeed = halleyBaseSpeed * Math.max(0.8, Math.min(9.0, (halleyA * 0.8) / Math.max(halleyDistNow * halleyDistNow * 0.04, 0.06)));
            halleyAngle -= keplerSpeed * (delta * 30); // retrógrado: decrementa
            if (halleyAngle < -Math.PI) halleyAngle += Math.PI * 2;

            // Posição no espaço (com inclinação aplicada)
            const hpx = halleyA * Math.cos(halleyAngle) - halleyC;
            const hpz = halleyB * Math.sin(halleyAngle);
            const halleyWorldPos = new THREE.Vector3(hpx, 0, hpz);
            halleyWorldPos.applyEuler(halleyTilt);
            halleyMesh.position.copy(halleyWorldPos);
            halleyMesh.rotation.y += 0.005;

            // Direção da cauda: sempre aponta para longe do Sol
            const distSunHalley = halleyMesh.position.length();
            const tailDir = halleyMesh.position.clone().negate().normalize();

            // Comprimento da cauda inversamente proporcional à distância (maior perto do sol)
            const tailLen = Math.max(0.4, Math.min(5.5, 10.0 / Math.max(distSunHalley, 0.8)));

            // Construir segundo vetor perpendicular à cauda para dispersão
            const upRef = new THREE.Vector3(0, 1, 0);
            const perpA = new THREE.Vector3().crossVectors(tailDir, upRef).normalize();
            const perpB = new THREE.Vector3().crossVectors(tailDir, perpA).normalize();

            const tailPosArr = tailGeo.attributes.position.array;
            for (let i = 0; i < tailCount; i++) {
                const t = Math.pow(i / tailCount, 0.65);
                const spread = t * tailLen * 0.22;
                const ox = tailOffsets[i * 2]     * spread;
                const oz = tailOffsets[i * 2 + 1] * spread;
                tailPosArr[i * 3]     = halleyMesh.position.x + tailDir.x * t * tailLen + perpA.x * ox + perpB.x * oz;
                tailPosArr[i * 3 + 1] = halleyMesh.position.y + tailDir.y * t * tailLen + perpA.y * ox + perpB.y * oz;
                tailPosArr[i * 3 + 2] = halleyMesh.position.z + tailDir.z * t * tailLen + perpA.z * ox + perpB.z * oz;
            }
            tailGeo.attributes.position.needsUpdate = true;

            // Brilho do núcleo e coma variam com proximidade ao Sol
            halleyMat.emissiveIntensity = Math.max(0.2, Math.min(2.5, 4.5 / Math.max(distSunHalley, 0.6)));
            comaMesh.material.opacity   = Math.max(0.04, Math.min(0.30, 2.8 / Math.max(distSunHalley, 1.2)));
            tailMat.opacity             = Math.max(0.25, Math.min(0.85, 3.5 / Math.max(distSunHalley, 0.9)));
            
            updateFollowing();
            controls.update();
            effectComposer.render();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('✅ Sistema Solar 3D | Menu moderno + clique nos planetas + mobile otimizado');
    </script>
</body>
</html>
